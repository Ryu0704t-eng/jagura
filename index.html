)<.12){const k=Math.random()*3|0;w=['seven','seven','seven'];w[k]=['grape','clown','replay'][Math.random()*3|0];a=['grape','clown','replay']}else{do w=[rb(),rb(),rb()];while((w[0]==w[1]&&w[1]==w[2])||w[0]=='cherry');a=w.slice();if(Math.random()<.4){w=w.slice();w[Math.random()*3|0]=Math.random()<.6?'seven':'bar'}}\n return{w,a}}\nfunction relief(){if(st.credits>=3||phase!='idle'||st.bonus||st.replay)return;st.rel=(st.rel||0)+1;st.credits+=100;st.start+=100;cheer('\u6551\u6e08\uff01','\u30e1\u30c0\u30eb+100\u679a\uff08'+st.rel+'\u56de\u76ee\uff09',2.6);coins(50);fan();flash('#ffe27a',.8);msg('\u6551\u6e08\u767a\u52d5\uff01 \u30e1\u30c0\u30eb+100\u679a');ui()}\nfunction lever(){if(fx.sc&&(fx.sc.kind=='big'||fx.sc.kind=='end'))return;\n if(phase!='idle')return;\n if(!st.bonus&&!st.replay){if(st.credits<3){relief();return}if(st.credits<3*st.bet){const v=[30,10,5,2,1].find(v=>3*v<=st.credits);st.bet=v;pt();msg('\u30e1\u30c0\u30eb\u4e0d\u8db3\u306e\u305f\u3081BET\u3092\u00d7'+v+'\u306b\u4e0b\u3052\u307e\u3057\u305f')}st.credits-=3*st.bet}\n $('bt').textContent=(st.bonus||st.replay)?0:3*st.bet;st.replay=false;\n const had=st.lamp;cur=lottery();pl=plan(cur);\n fx.lv=1;fx.win=0;$('wn').textContent=0;picks=[];phase='spin';R.forEach(r=>r.s='spin');\n tone(180,.12,'sawtooth',.05);tone(320,.1,'sawtooth',.05,.08);\n if(st.lamp&&!had)gogo();else yokoku();\n msg(st.bonus?'\u30dc\u30fc\u30ca\u30b9\u4e2d\uff01\u30dc\u30bf\u30f3\u3092\u62bc\u305b\uff01':'\u8d64\u3044\u30dc\u30bf\u30f3\u3092\u597d\u304d\u306a\u9806\u3067\u62bc\u305b\uff01');ui()}\nfunction stopReel(i){\n if(phase!='spin'||R[i].s!='spin')return;\n const f=Math.floor(R[i].t),c=[0,1,2,3,4].map(s=>f-s),sy=k=>strips[i][((k%N)+N)%N];\n let k=c.find(k=>sy(k)==pl.w[i]);if(k===undefined)k=c.find(k=>sy(k)==pl.a[i]);if(k===undefined)k=c[0];\n R[i].s='stopping';R[i].tgt=k;picks[i]=sy(k);\n if(picks.filter(s=>s=='seven').length>=2&&R.some(r=>r.s=='spin')&&!fx.tens){fx.tens=1;reach();tone(1200,.25,'sawtooth',.06)}\n ui()}\nfunction finish(){\n const r=ev(...picks);reachEnd(r=='big'||r=='reg');phase='idle';fx.tens=0;if(r!='replay')st.rpc=0;st.games++;\n let m='\u30cf\u30ba\u30ec',win=0;const s7=picks.filter(s=>s=='seven').length;\n if(st.bonus){const b=st.bonus;win=PAY[r]||0;b.games--;st.credits+=win;b.got+=win;m='\u30dc\u30fc\u30ca\u30b9\u4e2d +'+win+'\u679a';bonusFx(b,win);\n  if(b.games<=0){m=b.type.toUpperCase()+'\u7d42\u4e86\uff01 \u8a08'+b.got+'\u679a';st.bonus=null;bgmStop();endB(b);coins(70);fan()}}\n else if(r=='big'||r=='reg'){st.bonus={type:r,games:r=='big'?30:12,got:0};st[r]++;st.flag=null;st.lamp=false;\n  m=r=='big'?'BIG BONUS!!':'REG BONUS!';{const f=()=>{bigStart(r);flash('#fff',1.2)};fx.sc&&fx.sc.kind=='reach'?setTimeout(f,1300):f()}fx.sh=24;fx.rb=r=='big'?4:2.5;coins(r=='big'?150:80);fan();bgmStart();burst('ex_orange',276,CYL,400,.9);[1,2,3,4].forEach(i=>setTimeout(()=>{burst(['ex_blue','ex_purple','ex_orange','ex_blue'][i-1],100+Math.random()*350,200+Math.random()*350,260,.7);coins(30);fx.sh=10;tone(500+i*150,.2,'triangle',.07)},i*350))}\n else{win=PAY[r]||0;st.credits+=win;\n  if(r=='replay'){st.replay=true;st.rpc=(st.rpc||0)+1;m='\u30ea\u30d7\u30ec\u30a4\uff01 \u6b21\u306f\u6295\u5165\u306a\u3057'+(st.rpc>1?'\uff08'+st.rpc+'\u9023\uff09':'');replayFx(st.rpc)}\n  else if(win){m={grape:'\u30b9\u30a4\u30ab',clown:'\u30d9\u30eb',cherry:'\u30c1\u30a7\u30ea\u30fc'}[r]+' +'+win+'\u679a';if(r=='clown')scene('gold','BELL','+'+win,1.1)}\n  if(st.flag){if(!st.lamp)gogo();st.lamp=true;m='GOGO!! 7\u3092\u63c3\u3048\u308d\uff01'}\n  if(s7>=2&&r!='big'&&r!='reg'&&!(fx.sc&&fx.sc.kind=='reach'))cs(rc(),'\u3046\u308f\u3041\u2026\u60dc\u3057\u3044\uff01','blue',1.4,1)}\n if(win){fx.win=win;fx.hl=1;coins(Math.min(70,win*4));fx.sh=Math.max(fx.sh,8);pop('+'+win,'#ffe94d',win>=8?46:32);tone(784,.1,'triangle',.06)}\n checkTrophy();if(!st.bonus&&!st.replay&&st.credits<3)setTimeout(relief,2200);$('wn').textContent=win;msg(m);ui()}\n/* ===== UI ===== */\nfunction pt(){\n const b=st.bet,im=k=>'<img src
